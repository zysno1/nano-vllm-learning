<?xml version="1.0" encoding="UTF-8"?>
<svg width="800" height="600" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="engineGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4CAF50;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#45a049;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="schedulerGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2196F3;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1976D2;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="cacheGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FF9800;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#F57C00;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="modelGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#9C27B0;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#7B1FA2;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- 背景 -->
  <rect width="800" height="600" fill="#f8f9fa" stroke="#dee2e6" stroke-width="2"/>
  
  <!-- 标题 -->
  <text x="400" y="30" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="#333">nano-vLLM 系统架构</text>
  
  <!-- 客户端层 -->
  <rect x="50" y="60" width="700" height="60" fill="#e3f2fd" stroke="#1976d2" stroke-width="2" rx="5"/>
  <text x="400" y="85" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#1976d2">客户端请求层</text>
  <text x="150" y="105" font-family="Arial, sans-serif" font-size="12" fill="#666">HTTP API</text>
  <text x="300" y="105" font-family="Arial, sans-serif" font-size="12" fill="#666">WebSocket</text>
  <text x="450" y="105" font-family="Arial, sans-serif" font-size="12" fill="#666">gRPC</text>
  <text x="600" y="105" font-family="Arial, sans-serif" font-size="12" fill="#666">Streaming</text>
  
  <!-- LLM Engine 核心 -->
  <rect x="300" y="150" width="200" height="80" fill="url(#engineGrad)" stroke="#4CAF50" stroke-width="3" rx="10"/>
  <text x="400" y="175" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="white">LLM Engine</text>
  <text x="400" y="195" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="white">推理引擎核心</text>
  <text x="400" y="210" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="white">• 请求协调 • 流程管理</text>
  <text x="400" y="225" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="white">• 组件调度 • 结果聚合</text>
  
  <!-- Scheduler 调度器 -->
  <rect x="50" y="280" width="180" height="100" fill="url(#schedulerGrad)" stroke="#2196F3" stroke-width="2" rx="8"/>
  <text x="140" y="305" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="white">Scheduler</text>
  <text x="140" y="320" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="white">请求调度器</text>
  <text x="140" y="340" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="white">• 请求队列管理</text>
  <text x="140" y="355" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="white">• Continuous Batching</text>
  <text x="140" y="370" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="white">• 优先级调度</text>
  
  <!-- Model Runner 模型执行器 -->
  <rect x="280" y="280" width="180" height="100" fill="url(#modelGrad)" stroke="#9C27B0" stroke-width="2" rx="8"/>
  <text x="370" y="305" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="white">Model Runner</text>
  <text x="370" y="320" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="white">模型执行器</text>
  <text x="370" y="340" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="white">• 前向传播</text>
  <text x="370" y="355" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="white">• Attention 计算</text>
  <text x="370" y="370" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="white">• Token 采样</text>
  
  <!-- Cache Engine 缓存引擎 -->
  <rect x="510" y="280" width="180" height="100" fill="url(#cacheGrad)" stroke="#FF9800" stroke-width="2" rx="8"/>
  <text x="600" y="305" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="white">Cache Engine</text>
  <text x="600" y="320" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="white">缓存引擎</text>
  <text x="600" y="340" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="white">• KV Cache 管理</text>
  <text x="600" y="355" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="white">• PagedAttention</text>
  <text x="600" y="370" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="white">• 内存优化</text>
  
  <!-- Block Manager 块管理器 -->
  <rect x="50" y="420" width="150" height="80" fill="#607d8b" stroke="#455a64" stroke-width="2" rx="5"/>
  <text x="125" y="445" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="white">Block Manager</text>
  <text x="125" y="460" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="white">• 内存块分配</text>
  <text x="125" y="475" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="white">• Block Table 维护</text>
  <text x="125" y="490" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="white">• 碎片整理</text>
  
  <!-- GPU Memory GPU内存 -->
  <rect x="250" y="420" width="150" height="80" fill="#795548" stroke="#5d4037" stroke-width="2" rx="5"/>
  <text x="325" y="445" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="white">GPU Memory</text>
  <text x="325" y="460" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="white">• 模型参数</text>
  <text x="325" y="475" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="white">• KV Cache</text>
  <text x="325" y="490" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="white">• 激活值</text>
  
  <!-- Sampler 采样器 -->
  <rect x="450" y="420" width="150" height="80" fill="#e91e63" stroke="#c2185b" stroke-width="2" rx="5"/>
  <text x="525" y="445" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="white">Sampler</text>
  <text x="525" y="460" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="white">• Top-k/Top-p</text>
  <text x="525" y="475" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="white">• Temperature</text>
  <text x="525" y="490" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="white">• 并行采样</text>
  
  <!-- Performance Monitor 性能监控 -->
  <rect x="650" y="420" width="120" height="80" fill="#3f51b5" stroke="#303f9f" stroke-width="2" rx="5"/>
  <text x="710" y="440" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="white">Performance</text>
  <text x="710" y="455" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="white">Monitor</text>
  <text x="710" y="470" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="white">• 吞吐量统计</text>
  <text x="710" y="485" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="white">• 延迟监控</text>
  <text x="710" y="500" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="white">• 资源使用率</text>
  
  <!-- 连接线 -->
  <!-- 客户端到Engine -->
  <line x1="400" y1="120" x2="400" y2="150" stroke="#333" stroke-width="2" marker-end="url(#arrowhead)"/>
  
  <!-- Engine到各组件 -->
  <line x1="350" y1="230" x2="180" y2="280" stroke="#333" stroke-width="2" marker-end="url(#arrowhead)"/>
  <line x1="400" y1="230" x2="370" y2="280" stroke="#333" stroke-width="2" marker-end="url(#arrowhead)"/>
  <line x1="450" y1="230" x2="560" y2="280" stroke="#333" stroke-width="2" marker-end="url(#arrowhead)"/>
  
  <!-- 组件到底层 -->
  <line x1="140" y1="380" x2="125" y2="420" stroke="#333" stroke-width="2" marker-end="url(#arrowhead)"/>
  <line x1="370" y1="380" x2="325" y2="420" stroke="#333" stroke-width="2" marker-end="url(#arrowhead)"/>
  <line x1="370" y1="380" x2="525" y2="420" stroke="#333" stroke-width="2" marker-end="url(#arrowhead)"/>
  <line x1="600" y1="380" x2="325" y2="420" stroke="#333" stroke-width="2" marker-end="url(#arrowhead)"/>
  <line x1="600" y1="380" x2="710" y2="420" stroke="#333" stroke-width="2" marker-end="url(#arrowhead)"/>
  
  <!-- 箭头标记定义 -->
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#333"/>
    </marker>
  </defs>
  
  <!-- 数据流向标注 -->
  <text x="50" y="550" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#333">数据流向：</text>
  <text x="150" y="550" font-family="Arial, sans-serif" font-size="11" fill="#666">请求 → 调度 → 推理 → 采样 → 缓存 → 响应</text>
  
  <!-- 关键特性标注 -->
  <text x="450" y="550" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#333">核心特性：</text>
  <text x="530" y="550" font-family="Arial, sans-serif" font-size="11" fill="#666">PagedAttention • Continuous Batching • 动态内存管理</text>
  
  <!-- 性能指标 -->
  <rect x="50" y="560" width="700" height="30" fill="#f1f3f4" stroke="#dadce0" stroke-width="1" rx="3"/>
  <text x="60" y="580" font-family="Arial, sans-serif" font-size="10" fill="#333">高吞吐量: 1000+ tokens/s | 低延迟: &lt;100ms TTFT | 高内存利用率: 90%+ | 支持并发: 100+ 请求</text>
</svg>