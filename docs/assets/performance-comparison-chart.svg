<svg viewBox="0 0 1200 800" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="performanceGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#667eea;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#764ba2;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="improvementGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#11998e;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#38ef7d;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="2" dy="2" stdDeviation="3" flood-color="#000000" flood-opacity="0.3"/>
    </filter>
  </defs>
  
  <!-- 背景 -->
  <rect width="1200" height="800" fill="#f8fafc"/>
  
  <!-- 标题 -->
  <text x="600" y="40" text-anchor="middle" font-family="Arial, sans-serif" font-size="28" font-weight="bold" fill="#2d3748">
    nano-vLLM 性能优化效果对比
  </text>
  <text x="600" y="65" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#718096">
    Performance Optimization Comparison & Quantitative Analysis
  </text>
  
  <!-- 左侧：吞吐量对比 -->
  <g transform="translate(50, 100)">
    <text x="0" y="0" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#2d3748">
      吞吐量对比 (Throughput Comparison)
    </text>
    
    <!-- 基准线 -->
    <line x1="0" y1="200" x2="300" y2="200" stroke="#e2e8f0" stroke-width="2"/>
    <text x="0" y="220" font-family="Arial, sans-serif" font-size="12" fill="#718096">0</text>
    <text x="300" y="220" font-family="Arial, sans-serif" font-size="12" fill="#718096">100 req/s</text>
    
    <!-- 传统方法 -->
    <rect x="20" y="160" width="60" height="40" fill="#e53e3e" filter="url(#shadow)"/>
    <text x="50" y="185" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="white" font-weight="bold">25.3</text>
    <text x="50" y="240" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#2d3748">传统推理</text>
    
    <!-- PagedAttention -->
    <rect x="100" y="120" width="60" height="80" fill="url(#performanceGradient)" filter="url(#shadow)"/>
    <text x="130" y="165" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="white" font-weight="bold">48.7</text>
    <text x="130" y="240" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#2d3748">PagedAttention</text>
    
    <!-- Continuous Batching -->
    <rect x="180" y="80" width="60" height="120" fill="url(#performanceGradient)" filter="url(#shadow)"/>
    <text x="210" y="145" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="white" font-weight="bold">72.1</text>
    <text x="210" y="240" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#2d3748">Continuous Batching</text>
    
    <!-- 智能调度 -->
    <rect x="260" y="40" width="60" height="160" fill="url(#improvementGradient)" filter="url(#shadow)"/>
    <text x="290" y="125" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="white" font-weight="bold">95.8</text>
    <text x="290" y="240" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#2d3748">智能调度</text>
    
    <!-- 提升百分比 -->
    <text x="130" y="270" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#38a169" font-weight="bold">+92%</text>
    <text x="210" y="270" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#38a169" font-weight="bold">+185%</text>
    <text x="290" y="270" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#38a169" font-weight="bold">+279%</text>
  </g>
  
  <!-- 右侧：延迟对比 -->
  <g transform="translate(400, 100)">
    <text x="0" y="0" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#2d3748">
      延迟对比 (Latency Comparison)
    </text>
    
    <!-- 基准线 -->
    <line x1="0" y1="200" x2="300" y2="200" stroke="#e2e8f0" stroke-width="2"/>
    <text x="0" y="220" font-family="Arial, sans-serif" font-size="12" fill="#718096">0</text>
    <text x="300" y="220" font-family="Arial, sans-serif" font-size="12" fill="#718096">5.0s</text>
    
    <!-- 传统方法 (高延迟) -->
    <rect x="20" y="40" width="60" height="160" fill="#e53e3e" filter="url(#shadow)"/>
    <text x="50" y="125" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="white" font-weight="bold">4.2s</text>
    <text x="50" y="240" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#2d3748">传统推理</text>
    
    <!-- PagedAttention -->
    <rect x="100" y="100" width="60" height="100" fill="url(#performanceGradient)" filter="url(#shadow)"/>
    <text x="130" y="155" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="white" font-weight="bold">2.5s</text>
    <text x="130" y="240" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#2d3748">PagedAttention</text>
    
    <!-- Continuous Batching -->
    <rect x="180" y="140" width="60" height="60" fill="url(#performanceGradient)" filter="url(#shadow)"/>
    <text x="210" y="175" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="white" font-weight="bold">1.5s</text>
    <text x="210" y="240" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#2d3748">Continuous Batching</text>
    
    <!-- 智能调度 -->
    <rect x="260" y="170" width="60" height="30" fill="url(#improvementGradient)" filter="url(#shadow)"/>
    <text x="290" y="190" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="white" font-weight="bold">0.8s</text>
    <text x="290" y="240" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#2d3748">智能调度</text>
    
    <!-- 降低百分比 -->
    <text x="130" y="270" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#38a169" font-weight="bold">-40%</text>
    <text x="210" y="270" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#38a169" font-weight="bold">-64%</text>
    <text x="290" y="270" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#38a169" font-weight="bold">-81%</text>
  </g>
  
  <!-- 底部：资源利用率对比 -->
  <g transform="translate(750, 100)">
    <text x="0" y="0" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#2d3748">
      资源利用率 (Resource Utilization)
    </text>
    
    <!-- GPU利用率 -->
    <text x="0" y="30" font-family="Arial, sans-serif" font-size="14" fill="#4a5568">GPU利用率</text>
    <rect x="0" y="40" width="200" height="20" fill="#e2e8f0" rx="10"/>
    <rect x="0" y="40" width="45" height="20" fill="#e53e3e" rx="10"/>
    <text x="50" y="55" font-family="Arial, sans-serif" font-size="12" fill="#2d3748">传统: 22.5%</text>
    
    <rect x="0" y="70" width="200" height="20" fill="#e2e8f0" rx="10"/>
    <rect x="0" y="70" width="165" height="20" fill="url(#improvementGradient)" rx="10"/>
    <text x="170" y="85" font-family="Arial, sans-serif" font-size="12" fill="#2d3748">nano-vLLM: 82.5%</text>
    
    <!-- 内存利用率 -->
    <text x="0" y="110" font-family="Arial, sans-serif" font-size="14" fill="#4a5568">内存利用率</text>
    <rect x="0" y="120" width="200" height="20" fill="#e2e8f0" rx="10"/>
    <rect x="0" y="120" width="70" height="20" fill="#e53e3e" rx="10"/>
    <text x="75" y="135" font-family="Arial, sans-serif" font-size="12" fill="#2d3748">传统: 35%</text>
    
    <rect x="0" y="150" width="200" height="20" fill="#e2e8f0" rx="10"/>
    <rect x="0" y="150" width="180" height="20" fill="url(#improvementGradient)" rx="10"/>
    <text x="185" y="165" font-family="Arial, sans-serif" font-size="12" fill="#2d3748">nano-vLLM: 90%</text>
    
    <!-- 性能提升汇总 -->
    <rect x="0" y="190" width="200" height="80" fill="#f7fafc" stroke="#e2e8f0" stroke-width="2" rx="8"/>
    <text x="100" y="210" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#2d3748">
      综合性能提升
    </text>
    <text x="100" y="230" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#38a169" font-weight="bold">
      吞吐量: +279%
    </text>
    <text x="100" y="245" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#38a169" font-weight="bold">
      延迟: -81%
    </text>
    <text x="100" y="260" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#38a169" font-weight="bold">
      资源利用率: +157%
    </text>
  </g>
  
  <!-- 底部：优化技术详细对比表 -->
  <g transform="translate(50, 400)">
    <text x="0" y="0" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#2d3748">
      优化技术详细对比 (Detailed Optimization Techniques Comparison)
    </text>
    
    <!-- 表格头部 -->
    <rect x="0" y="20" width="1100" height="40" fill="url(#performanceGradient)" rx="5"/>
    <text x="80" y="45" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="white">优化技术</text>
    <text x="220" y="45" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="white">吞吐量提升</text>
    <text x="360" y="45" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="white">延迟降低</text>
    <text x="500" y="45" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="white">内存效率</text>
    <text x="640" y="45" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="white">GPU利用率</text>
    <text x="780" y="45" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="white">实现复杂度</text>
    <text x="920" y="45" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="white">推荐指数</text>
    
    <!-- 表格行 -->
    <g transform="translate(0, 60)">
      <!-- PagedAttention -->
      <rect x="0" y="0" width="1100" height="35" fill="#ffffff" stroke="#e2e8f0"/>
      <text x="80" y="22" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#2d3748">PagedAttention</text>
      <text x="220" y="22" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#38a169" font-weight="bold">+92%</text>
      <text x="360" y="22" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#38a169" font-weight="bold">-40%</text>
      <text x="500" y="22" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#38a169" font-weight="bold">+156%</text>
      <text x="640" y="22" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#38a169" font-weight="bold">+85%</text>
      <text x="780" y="22" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#f6ad55">中等</text>
      <text x="920" y="22" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#38a169">⭐⭐⭐⭐⭐</text>
      
      <!-- Continuous Batching -->
      <rect x="0" y="35" width="1100" height="35" fill="#f7fafc" stroke="#e2e8f0"/>
      <text x="80" y="57" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#2d3748">Continuous Batching</text>
      <text x="220" y="57" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#38a169" font-weight="bold">+185%</text>
      <text x="360" y="57" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#38a169" font-weight="bold">-64%</text>
      <text x="500" y="57" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#38a169" font-weight="bold">+78%</text>
      <text x="640" y="57" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#38a169" font-weight="bold">+120%</text>
      <text x="780" y="57" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#68d391">简单</text>
      <text x="920" y="57" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#38a169">⭐⭐⭐⭐⭐</text>
      
      <!-- 智能调度 -->
      <rect x="0" y="70" width="1100" height="35" fill="#ffffff" stroke="#e2e8f0"/>
      <text x="80" y="92" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#2d3748">智能调度</text>
      <text x="220" y="92" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#38a169" font-weight="bold">+279%</text>
      <text x="360" y="92" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#38a169" font-weight="bold">-81%</text>
      <text x="500" y="92" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#38a169" font-weight="bold">+157%</text>
      <text x="640" y="92" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#38a169" font-weight="bold">+267%</text>
      <text x="780" y="92" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#e53e3e">复杂</text>
      <text x="920" y="92" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#38a169">⭐⭐⭐⭐⭐</text>
      
      <!-- 混合精度 -->
      <rect x="0" y="105" width="1100" height="35" fill="#f7fafc" stroke="#e2e8f0"/>
      <text x="80" y="127" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#2d3748">混合精度</text>
      <text x="220" y="127" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#38a169" font-weight="bold">+45%</text>
      <text x="360" y="127" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#38a169" font-weight="bold">-25%</text>
      <text x="500" y="127" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#38a169" font-weight="bold">+50%</text>
      <text x="640" y="127" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#38a169" font-weight="bold">+35%</text>
      <text x="780" y="127" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#68d391">简单</text>
      <text x="920" y="127" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#38a169">⭐⭐⭐⭐</text>
      
      <!-- 算子融合 -->
      <rect x="0" y="140" width="1100" height="35" fill="#ffffff" stroke="#e2e8f0"/>
      <text x="80" y="162" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#2d3748">算子融合</text>
      <text x="220" y="162" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#38a169" font-weight="bold">+32%</text>
      <text x="360" y="162" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#38a169" font-weight="bold">-18%</text>
      <text x="500" y="162" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#38a169" font-weight="bold">+25%</text>
      <text x="640" y="162" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#38a169" font-weight="bold">+28%</text>
      <text x="780" y="162" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#f6ad55">中等</text>
      <text x="920" y="162" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#38a169">⭐⭐⭐⭐</text>
    </g>
  </g>
  
  <!-- 底部说明 -->
  <text x="600" y="750" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#718096">
    * 数据基于标准基准测试，实际性能可能因硬件配置和工作负载而异
  </text>
  <text x="600" y="770" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#718096">
    * Performance data based on standard benchmarks, actual results may vary by hardware and workload
  </text>
</svg>