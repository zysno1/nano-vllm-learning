<svg viewBox="0 0 1200 800" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="memoryGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#4CAF50;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#81C784;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="wasteGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#F44336;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#EF5350;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="2" dy="2" stdDeviation="3" flood-color="#000000" flood-opacity="0.3"/>
    </filter>
  </defs>
  
  <!-- 标题 -->
  <text x="600" y="40" text-anchor="middle" font-family="Arial, sans-serif" font-size="28" font-weight="bold" fill="#2C3E50">
    PagedAttention vs 传统注意力机制
  </text>
  
  <!-- 传统注意力部分 -->
  <g id="traditional-attention">
    <text x="300" y="90" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="#E74C3C">
      传统注意力机制
    </text>
    
    <!-- 内存块表示 -->
    <g id="traditional-memory">
      <rect x="50" y="110" width="500" height="60" fill="url(#wasteGradient)" stroke="#C0392B" stroke-width="2" filter="url(#shadow)"/>
      <text x="300" y="145" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="white">
        预分配固定内存 (浪费严重)
      </text>
      
      <!-- 内存使用情况 -->
      <rect x="60" y="120" width="120" height="40" fill="#27AE60" opacity="0.8"/>
      <text x="120" y="143" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="white">实际使用</text>
      
      <rect x="180" y="120" width="360" height="40" fill="#E74C3C" opacity="0.6"/>
      <text x="360" y="143" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="white">内存浪费 (72%)</text>
    </g>
    
    <!-- 性能指标 -->
    <g id="traditional-metrics">
      <rect x="50" y="190" width="500" height="120" fill="#ECF0F1" stroke="#BDC3C7" stroke-width="1" rx="5"/>
      <text x="300" y="215" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#2C3E50">
        性能指标
      </text>
      
      <!-- 内存利用率 -->
      <text x="70" y="240" font-family="Arial, sans-serif" font-size="14" fill="#34495E">内存利用率:</text>
      <rect x="180" y="225" width="200" height="20" fill="#E8E8E8" rx="10"/>
      <rect x="180" y="225" width="56" height="20" fill="#E74C3C" rx="10"/>
      <text x="390" y="238" font-family="Arial, sans-serif" font-size="12" fill="#E74C3C" font-weight="bold">28%</text>
      
      <!-- 支持序列长度 -->
      <text x="70" y="265" font-family="Arial, sans-serif" font-size="14" fill="#34495E">最大序列长度:</text>
      <text x="390" y="265" font-family="Arial, sans-serif" font-size="14" fill="#E74C3C" font-weight="bold">512 tokens</text>
      
      <!-- 批处理大小 -->
      <text x="70" y="290" font-family="Arial, sans-serif" font-size="14" fill="#34495E">批处理大小:</text>
      <text x="390" y="290" font-family="Arial, sans-serif" font-size="14" fill="#E74C3C" font-weight="bold">4 requests</text>
    </g>
  </g>
  
  <!-- PagedAttention部分 -->
  <g id="paged-attention">
    <text x="900" y="90" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="#27AE60">
      PagedAttention机制
    </text>
    
    <!-- 分页内存块 -->
    <g id="paged-memory">
      <text x="900" y="125" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#2C3E50">
        动态分页内存管理
      </text>
      
      <!-- 内存块 -->
      <g id="memory-blocks">
        <rect x="650" y="140" width="80" height="30" fill="#27AE60" stroke="#1E8449" stroke-width="2" rx="3"/>
        <text x="690" y="158" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="white">Block 1</text>
        
        <rect x="740" y="140" width="80" height="30" fill="#27AE60" stroke="#1E8449" stroke-width="2" rx="3"/>
        <text x="780" y="158" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="white">Block 2</text>
        
        <rect x="830" y="140" width="80" height="30" fill="#27AE60" stroke="#1E8449" stroke-width="2" rx="3"/>
        <text x="870" y="158" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="white">Block 3</text>
        
        <rect x="920" y="140" width="80" height="30" fill="#F39C12" stroke="#D68910" stroke-width="2" rx="3"/>
        <text x="960" y="158" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="white">Block 4</text>
        
        <rect x="1010" y="140" width="80" height="30" fill="#95A5A6" stroke="#7F8C8D" stroke-width="2" rx="3"/>
        <text x="1050" y="158" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="white">Free</text>
      </g>
      
      <!-- 图例 -->
      <g id="legend">
        <rect x="650" y="180" width="15" height="15" fill="#27AE60"/>
        <text x="675" y="192" font-family="Arial, sans-serif" font-size="12" fill="#2C3E50">已使用</text>
        
        <rect x="730" y="180" width="15" height="15" fill="#F39C12"/>
        <text x="755" y="192" font-family="Arial, sans-serif" font-size="12" fill="#2C3E50">部分使用</text>
        
        <rect x="830" y="180" width="15" height="15" fill="#95A5A6"/>
        <text x="855" y="192" font-family="Arial, sans-serif" font-size="12" fill="#2C3E50">空闲</text>
      </g>
    </g>
    
    <!-- 性能指标 -->
    <g id="paged-metrics">
      <rect x="650" y="210" width="500" height="120" fill="#E8F5E8" stroke="#27AE60" stroke-width="1" rx="5"/>
      <text x="900" y="235" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#2C3E50">
        性能指标
      </text>
      
      <!-- 内存利用率 -->
      <text x="670" y="260" font-family="Arial, sans-serif" font-size="14" fill="#34495E">内存利用率:</text>
      <rect x="780" y="245" width="200" height="20" fill="#E8E8E8" rx="10"/>
      <rect x="780" y="245" width="174" height="20" fill="#27AE60" rx="10"/>
      <text x="990" y="258" font-family="Arial, sans-serif" font-size="12" fill="#27AE60" font-weight="bold">87%</text>
      
      <!-- 支持序列长度 -->
      <text x="670" y="285" font-family="Arial, sans-serif" font-size="14" fill="#34495E">最大序列长度:</text>
      <text x="990" y="285" font-family="Arial, sans-serif" font-size="14" fill="#27AE60" font-weight="bold">2048 tokens</text>
      
      <!-- 批处理大小 -->
      <text x="670" y="310" font-family="Arial, sans-serif" font-size="14" fill="#34495E">批处理大小:</text>
      <text x="990" y="310" font-family="Arial, sans-serif" font-size="14" fill="#27AE60" font-weight="bold">16 requests</text>
    </g>
  </g>
  
  <!-- 对比箭头 -->
  <g id="comparison-arrow">
    <path d="M 570 200 L 630 200" stroke="#3498DB" stroke-width="3" fill="none" marker-end="url(#arrowhead)"/>
    <text x="600" y="190" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#3498DB" font-weight="bold">
      优化
    </text>
  </g>
  
  <!-- 箭头标记 -->
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#3498DB"/>
    </marker>
  </defs>
  
  <!-- 核心优势说明 -->
  <g id="advantages">
    <rect x="200" y="360" width="800" height="180" fill="#F8F9FA" stroke="#DEE2E6" stroke-width="1" rx="10" filter="url(#shadow)"/>
    <text x="600" y="390" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="#2C3E50">
      PagedAttention 核心优势
    </text>
    
    <!-- 优势列表 -->
    <g id="advantage-list">
      <!-- 内存效率 -->
      <circle cx="250" cy="420" r="8" fill="#27AE60"/>
      <text x="270" y="425" font-family="Arial, sans-serif" font-size="14" fill="#2C3E50">
        <tspan font-weight="bold">内存效率提升 3.1x:</tspan> 动态分配，减少内存碎片和浪费
      </text>
      
      <!-- 序列长度 -->
      <circle cx="250" cy="450" r="8" fill="#3498DB"/>
      <text x="270" y="455" font-family="Arial, sans-serif" font-size="14" fill="#2C3E50">
        <tspan font-weight="bold">序列长度提升 4x:</tspan> 支持更长的上下文处理
      </text>
      
      <!-- 吞吐量 -->
      <circle cx="250" cy="480" r="8" fill="#F39C12"/>
      <text x="270" y="485" font-family="Arial, sans-serif" font-size="14" fill="#2C3E50">
        <tspan font-weight="bold">吞吐量提升 2.4x:</tspan> 更大的批处理大小和并发处理
      </text>
      
      <!-- 延迟 -->
      <circle cx="250" cy="510" r="8" fill="#9B59B6"/>
      <text x="270" y="515" font-family="Arial, sans-serif" font-size="14" fill="#2C3E50">
        <tspan font-weight="bold">延迟降低 40%:</tspan> 优化的内存访问模式和缓存策略
      </text>
    </g>
  </g>
  
  <!-- 技术原理图 -->
  <g id="technical-principle">
    <rect x="50" y="570" width="1100" height="200" fill="#FAFBFC" stroke="#E1E4E8" stroke-width="1" rx="10"/>
    <text x="600" y="600" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#2C3E50">
      技术原理：虚拟内存分页机制
    </text>
    
    <!-- 虚拟地址空间 -->
    <g id="virtual-address">
      <text x="150" y="630" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#34495E">
        虚拟地址空间
      </text>
      <rect x="80" y="640" width="140" height="80" fill="#E3F2FD" stroke="#2196F3" stroke-width="2" rx="5"/>
      
      <!-- 虚拟页 -->
      <rect x="90" y="650" width="30" height="15" fill="#2196F3" opacity="0.8"/>
      <text x="105" y="660" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="white">P0</text>
      
      <rect x="125" y="650" width="30" height="15" fill="#2196F3" opacity="0.8"/>
      <text x="140" y="660" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="white">P1</text>
      
      <rect x="160" y="650" width="30" height="15" fill="#2196F3" opacity="0.8"/>
      <text x="175" y="660" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="white">P2</text>
      
      <rect x="195" y="650" width="15" height="15" fill="#FFC107" opacity="0.8"/>
      <text x="202" y="660" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="white">...</text>
    </g>
    
    <!-- 映射箭头 -->
    <path d="M 220 680 Q 300 700 380 680" stroke="#FF5722" stroke-width="2" fill="none" marker-end="url(#arrowhead2)"/>
    <text x="300" y="710" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#FF5722" font-weight="bold">
      动态映射
    </text>
    
    <!-- 物理内存池 -->
    <g id="physical-memory">
      <text x="500" y="630" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#34495E">
        物理内存池
      </text>
      <rect x="380" y="640" width="240" height="80" fill="#E8F5E8" stroke="#4CAF50" stroke-width="2" rx="5"/>
      
      <!-- 物理块 -->
      <rect x="390" y="650" width="30" height="25" fill="#4CAF50"/>
      <text x="405" y="665" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="white">B0</text>
      
      <rect x="425" y="650" width="30" height="25" fill="#4CAF50"/>
      <text x="440" y="665" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="white">B1</text>
      
      <rect x="460" y="650" width="30" height="25" fill="#FF9800"/>
      <text x="475" y="665" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="white">B2</text>
      
      <rect x="495" y="650" width="30" height="25" fill="#9E9E9E"/>
      <text x="510" y="665" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="white">Free</text>
      
      <rect x="530" y="650" width="30" height="25" fill="#9E9E9E"/>
      <text x="545" y="665" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="white">Free</text>
      
      <rect x="565" y="650" width="30" height="25" fill="#9E9E9E"/>
      <text x="580" y="665" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="white">Free</text>
    </g>
    
    <!-- KV Cache管理 -->
    <g id="kv-cache">
      <text x="850" y="630" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#34495E">
        KV Cache 管理
      </text>
      <rect x="720" y="640" width="260" height="80" fill="#FFF3E0" stroke="#FF9800" stroke-width="2" rx="5"/>
      
      <!-- Cache块 -->
      <rect x="730" y="650" width="40" height="25" fill="#FF9800"/>
      <text x="750" y="665" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="white">Key</text>
      
      <rect x="775" y="650" width="40" height="25" fill="#FF9800"/>
      <text x="795" y="665" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="white">Value</text>
      
      <rect x="820" y="650" width="40" height="25" fill="#FFC107"/>
      <text x="840" y="665" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="white">Key</text>
      
      <rect x="865" y="650" width="40" height="25" fill="#FFC107"/>
      <text x="885" y="665" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="white">Value</text>
      
      <rect x="910" y="650" width="40" height="25" fill="#E0E0E0"/>
      <text x="930" y="665" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#666">Empty</text>
    </g>
  </g>
  
  <!-- 第二个箭头标记 -->
  <defs>
    <marker id="arrowhead2" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#FF5722"/>
    </marker>
  </defs>
</svg>